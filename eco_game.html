<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIF 生态游戏</title>
  <style>
    :root {
      --bg: #f3f6f8;
      --panel: #ffffff;
      --line: #d8e0e7;
      --ink: #1d2733;
      --muted: #607080;
      --green: #16845a;
      --amber: #c47a09;
      --red: #c33a3a;
      --blue: #2563eb;
      --soft: #e9eef2;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      line-height: 1.4;
    }
    .app {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 16px;
      display: grid;
      gap: 14px;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .title { font-size: 20px; font-weight: 700; margin-right: auto; }
    .badge {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 5px 9px;
      background: var(--panel);
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .badge strong { color: var(--ink); font-weight: 650; }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      color: var(--ink);
    }
    .toggle input { width: 15px; height: 15px; accent-color: var(--green); }
    .button {
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
    }
    .button.primary { background: var(--green); border-color: var(--green); color: #fff; }
    .statstrip {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      min-height: 68px;
    }
    .stat .label { font-size: 11px; color: var(--muted); }
    .stat .value { font-size: 20px; font-weight: 700; margin-top: 3px; }
    .stat .sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(320px, 0.8fr);
      gap: 14px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
    }
    .panel h2 {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 700;
    }
    .dish {
      position: relative;
      width: 100%;
    }
    #dish {
      width: 100%;
      height: 480px;
      display: block;
      background: #f8fafb;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: crosshair;
    }
    .side {
      display: grid;
      gap: 14px;
    }
    .food {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }
    .food canvas {
      width: 112px;
      height: 112px;
      display: block;
      background: #0c0f13;
      border-radius: 6px;
      border: 1px solid var(--line);
    }
    .food .meta { min-width: 0; }
    .food .digit {
      font-size: 44px;
      font-weight: 800;
      line-height: 1;
      color: var(--ink);
    }
    .food .source {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
      overflow-wrap: anywhere;
    }
    .feedgrid {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
      margin-top: 12px;
    }
    .feedgrid .button { min-height: 36px; padding: 0; font-weight: 650; }
    .sliders {
      display: grid;
      gap: 10px;
    }
    .slider-row {
      display: grid;
      grid-template-columns: minmax(108px, 1fr) minmax(120px, 1.6fr) 52px;
      align-items: center;
      gap: 9px;
      min-height: 32px;
    }
    .slider-row label { font-size: 12px; color: var(--ink); }
    .slider-row output { font-size: 12px; font-weight: 650; text-align: right; }
    input[type="range"] {
      width: 100%;
      accent-color: var(--blue);
    }
    .inspect {
      min-height: 170px;
    }
    .inspect.empty {
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
    }
    .inspect-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px 12px;
      font-size: 12px;
    }
    .inspect-grid .cell {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid #edf1f4;
      padding-bottom: 5px;
    }
    .inspect-grid .cell span:first-child { color: var(--muted); }
    .arch { margin-top: 10px; width: 100%; }
    .arch svg { width: 100%; height: auto; display: block; }
    .charts {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 12px;
    }
    .chart-wrap canvas {
      width: 100%;
      height: 170px;
      display: block;
    }
    .chart-wrap .legend {
      display: flex;
      gap: 12px;
      margin-top: 6px;
      font-size: 11px;
      color: var(--muted);
    }
    .legend-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 3px;
      margin-right: 5px;
      vertical-align: -1px;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .statstrip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      #dish { height: 390px; }
    }
    @media (max-width: 620px) {
      .app { padding: 10px; }
      .statstrip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .charts { grid-template-columns: 1fr; }
      .slider-row { grid-template-columns: 1fr; gap: 4px; }
      .slider-row output { text-align: left; }
      #dish { height: 330px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title">LIF 生态游戏</div>
      <span class="badge">回合 <strong id="round">0</strong></span>
      <span class="badge">种群 <strong id="population">0</strong></span>
      <span class="badge">自然死亡 <strong id="naturalRate">0%</strong></span>
      <label class="toggle">
        <input id="autoToggle" type="checkbox" checked>
        <span>自动喂食</span>
      </label>
      <button id="resetButton" class="button primary" type="button">重新播种</button>
    </header>

    <section class="statstrip" aria-label="统计数据">
      <div class="stat">
        <div class="label">本回合准确率</div>
        <div class="value" id="accuracy">-</div>
        <div class="sub" id="accuracySub"></div>
      </div>
      <div class="stat">
        <div class="label">存活率</div>
        <div class="value" id="survival">-</div>
        <div class="sub" id="survivalSub"></div>
      </div>
      <div class="stat">
        <div class="label">平均年龄</div>
        <div class="value" id="meanAge">-</div>
        <div class="sub" id="meanAgeSub"></div>
      </div>
      <div class="stat">
        <div class="label">深度分布</div>
        <div class="value" id="depth">-</div>
        <div class="sub" id="depthSub"></div>
      </div>
      <div class="stat">
        <div class="label">重播</div>
        <div class="value" id="resets">0</div>
        <div class="sub" id="resetsSub"></div>
      </div>
    </section>

    <section class="layout">
      <div class="panel dish">
        <canvas id="dish"></canvas>
      </div>

      <div class="side">
        <div class="panel">
          <h2>食物数字</h2>
          <div class="food">
            <canvas id="foodCanvas" width="28" height="28"></canvas>
            <div class="meta">
              <div class="digit" id="foodLabel">-</div>
              <div class="source" id="foodSource"></div>
            </div>
          </div>
          <div class="feedgrid" id="feedGrid"></div>
        </div>

        <div class="panel">
          <h2>参数</h2>
          <div class="sliders">
            <div class="slider-row">
              <label for="feedInterval">投喂间隔</label>
              <input id="feedInterval" type="range" min="1" max="10" step="0.5" value="5">
              <output id="feedIntervalValue">5s</output>
            </div>
            <div class="slider-row">
              <label for="survivalRounds">存活回合</label>
              <input id="survivalRounds" type="range" min="10" max="30" step="1" value="20">
              <output id="survivalRoundsValue">20</output>
            </div>
            <div class="slider-row">
              <label for="reproN">繁殖倍数</label>
              <input id="reproN" type="range" min="10" max="100" step="1" value="50">
              <output id="reproNValue">50</output>
            </div>
            <div class="slider-row">
              <label for="assort">选型强度</label>
              <input id="assort" type="range" min="0" max="100" step="1" value="50">
              <output id="assortValue">50%</output>
            </div>
            <div class="slider-row">
              <label for="capacity">承载力</label>
              <input id="capacity" type="range" min="100" max="10000" step="100" value="10000">
              <output id="capacityValue">10000</output>
            </div>
            <div class="slider-row">
              <label for="initPop">初始种群</label>
              <input id="initPop" type="range" min="60" max="1000" step="10" value="1000">
              <output id="initPopValue">1000</output>
            </div>
          </div>
        </div>

        <div class="panel inspect empty" id="inspectPanel">
          未选择个体
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="charts">
        <div class="chart-wrap">
          <canvas id="historyChart"></canvas>
          <div class="legend">
            <span><span class="legend-dot" style="background:#2563eb"></span>种群</span>
            <span><span class="legend-dot" style="background:#16845a"></span>准确率</span>
          </div>
        </div>
        <div class="chart-wrap">
          <canvas id="ageChart"></canvas>
          <div class="legend">
            <span><span class="legend-dot" style="background:#c47a09"></span>存活年龄分布</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    "use strict";

    const state = {
      config: {
        feed_interval: 5,
        survival_rounds: 20,
        n_repro: 50,
        assort_strength: 0.5,
        capacity: 10000,
        init_pop: 1000
      },
      round: 0,
      population_size: 0,
      natural_rate: 0,
      alive: [],
      history: { round: [], alive: [], accuracy: [], mean_age: [] },
      survival_histogram: [],
      depth_histogram: [0, 0, 0, 0],
      last_events: null,
      current_food: { label: "-", index: 0, image: [] }
    };

    let auto = true;
    let busy = false;
    let inspectId = null;
    let timer = null;

    const $ = (id) => document.getElementById(id);
    const foodCanvas = $("foodCanvas");
    const foodCtx = foodCanvas.getContext("2d");
    const dishCanvas = $("dish");
    const dishCtx = dishCanvas.getContext("2d");
    const historyCanvas = $("historyChart");
    const historyCtx = historyCanvas.getContext("2d");
    const ageCanvas = $("ageChart");
    const ageCtx = ageCanvas.getContext("2d");

    function hashInt(value) {
      let x = (value * 2654435761) >>> 0;
      x = Math.imul(x ^ (x >>> 16), 2246822507) >>> 0;
      x = Math.imul(x ^ (x >>> 13), 3266489909) >>> 0;
      x ^= x >>> 16;
      return (x >>> 0) / 4294967296;
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${path}`);
      }
      return response.json();
    }

    async function refreshState() {
      const next = await api("/api/state");
      Object.assign(state, next);
      renderAll();
      scheduleNext();
    }

    function scheduleNext() {
      clearTimeout(timer);
      if (!auto || state.stopped) return;
      const interval = Math.max(1, state.config.feed_interval || 5) * 1000;
      timer = setTimeout(autoStep, interval);
    }

    async function autoStep() {
      if (busy || !auto || state.stopped) return;
      busy = true;
      try {
        await api("/api/step", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}"
        });
        await refreshState();
      } catch (error) {
        console.error(error);
      } finally {
        busy = false;
      }
    }

    async function postConfig(payload) {
      busy = true;
      try {
        await api("/api/config", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        await refreshState();
      } catch (error) {
        console.error(error);
      } finally {
        busy = false;
      }
    }

    function renderStats() {
      $("round").textContent = state.round;
      $("population").textContent = state.population_size;
      $("naturalRate").textContent = `${Math.round(state.natural_rate * 100)}%`;
      $("resets").textContent = state.resets || 0;

      const events = state.last_events;
      const accuracy = events && typeof events.accuracy === "number" ? events.accuracy : null;
      $("accuracy").textContent = accuracy === null ? "-" : `${Math.round(accuracy * 100)}%`;
      $("accuracySub").textContent = accuracy === null ? "" : `正确 ${Math.round(accuracy * (events.alive_before || 0))} / ${events.alive_before || 0}`;

      const survival = events && typeof events.survival_rate === "number" ? events.survival_rate : null;
      $("survival").textContent = survival === null ? "-" : `${Math.round(survival * 100)}%`;
      $("survivalSub").textContent = events && events.offspring !== undefined ? `新生 ${events.offspring}` : "";

      const meanAge = events && typeof events.mean_age === "number" ? events.mean_age : null;
      $("meanAge").textContent = meanAge === null ? "-" : meanAge.toFixed(1);
      $("meanAgeSub").textContent = state.alive.length ? `年龄中位 ${medianAge().toFixed(0)}` : "";

      const depth = state.depth_histogram || [0, 0, 0, 0];
      const maxDepth = Math.max(1, ...depth.map(Number));
      $("depth").textContent = depth.map((value, index) => `${index + 1}:${value}`).join(" ");
      $("depthSub").textContent = `峰值 ${maxDepth}`;
      $("resetsSub").textContent = state.stopped ? "已停止" : "";
    }

    function medianAge() {
      const ages = state.alive.map((o) => o.age).sort((a, b) => a - b);
      if (!ages.length) return 0;
      const mid = Math.floor(ages.length / 2);
      return ages.length % 2 ? ages[mid] : (ages[mid - 1] + ages[mid]) / 2;
    }

    function renderFood() {
      const image = state.current_food && state.current_food.image ? state.current_food.image : [];
      if (image.length === 784) {
        const imageData = foodCtx.createImageData(28, 28);
        for (let i = 0; i < 784; i++) {
          const v = Math.max(0, Math.min(255, Math.round(image[i] * 255)));
          imageData.data[i * 4] = v;
          imageData.data[i * 4 + 1] = v;
          imageData.data[i * 4 + 2] = v;
          imageData.data[i * 4 + 3] = 255;
        }
        foodCtx.putImageData(imageData, 0, 0);
      }
      $("foodLabel").textContent = state.current_food ? state.current_food.label : "-";
      $("foodSource").textContent = state.current_food ? `MNIST #${state.current_food.index}` : "";
    }

    function ageColor(age, correct) {
      const maxAge = Math.max(1, state.config.survival_rounds || 20);
      const t = Math.min(1, age / maxAge);
      const hue = correct ? 150 : 32;
      const lightness = 62 - t * 18;
      return `hsl(${hue} 48% ${lightness}%)`;
    }

    function drawDish() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = dishCanvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      dishCanvas.width = Math.round(rect.width * dpr);
      dishCanvas.height = Math.round(rect.height * dpr);
      dishCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dishCtx.clearRect(0, 0, rect.width, rect.height);

      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const radius = Math.min(rect.width, rect.height) * 0.46;
      dishCtx.beginPath();
      dishCtx.arc(cx, cy, radius, 0, Math.PI * 2);
      dishCtx.fillStyle = "#f7fafb";
      dishCtx.fill();
      dishCtx.lineWidth = 2;
      dishCtx.strokeStyle = "#cbd8e1";
      dishCtx.stroke();

      dishCtx.beginPath();
      dishCtx.arc(cx, cy, radius * 0.97, 0, Math.PI * 2);
      dishCtx.lineWidth = 1;
      dishCtx.strokeStyle = "#e0e8ee";
      dishCtx.stroke();

      const pop = Math.max(1, state.population_size || state.alive.length || 1);
      const now = Date.now() / 1000;
      const size = pop > 700 ? 2.6 : pop > 250 ? 3.2 : 4.2;

      for (const organism of state.alive) {
        const h = hashInt(organism.id);
        const angle = h * Math.PI * 2 + Math.sin(now * 0.7 + organism.id) * 0.08;
        const rr = 0.16 + hashInt(organism.id * 7919) * 0.72;
        const x = cx + Math.cos(angle) * rr * radius * 0.93;
        const y = cy + Math.sin(angle) * rr * radius * 0.93;
        const selected = organism.id === inspectId;
        dishCtx.beginPath();
        dishCtx.arc(x, y, selected ? size + 3 : size, 0, Math.PI * 2);
        dishCtx.fillStyle = ageColor(organism.age, organism.correct);
        dishCtx.fill();
        dishCtx.strokeStyle = selected ? "#1d2733" : "rgba(255,255,255,0.75)";
        dishCtx.lineWidth = selected ? 2 : 1;
        dishCtx.stroke();
      }
    }

    function drawLineChart() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = historyCanvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      historyCanvas.width = Math.round(rect.width * dpr);
      historyCanvas.height = Math.round(rect.height * dpr);
      historyCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      historyCtx.clearRect(0, 0, rect.width, rect.height);

      const rounds = state.history.round || [];
      const alive = state.history.alive || [];
      const accuracy = state.history.accuracy || [];
      const pad = 10;
      const w = rect.width;
      const h = rect.height;
      const maxPop = Math.max(state.config.capacity || 1, ...alive.map(Number), 1);
      drawSeries(historyCtx, alive, pad, w, h, maxPop, "#2563eb", 2);
      drawSeries(historyCtx, accuracy, pad, w, h, 1, "#16845a", 2, true);
      drawGrid(historyCtx, pad, w, h);
      historyCtx.fillStyle = "#607080";
      historyCtx.font = "11px sans-serif";
      historyCtx.textBaseline = "bottom";
      historyCtx.fillText(rounds.length ? `回合 ${rounds.length}` : "", pad + 2, h - 2);
    }

    function drawGrid(ctx, pad, w, h) {
      ctx.strokeStyle = "#e8edf1";
      ctx.lineWidth = 1;
      for (let i = 0; i < 5; i++) {
        const y = pad + ((h - pad * 2) / 4) * i;
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(w - pad, y);
        ctx.stroke();
      }
    }

    function drawSeries(ctx, values, pad, w, h, max, color, lineWidth, fillUnder) {
      if (!values.length) return;
      ctx.beginPath();
      values.forEach((value, i) => {
        const x = pad + (i / Math.max(1, values.length - 1)) * (w - pad * 2);
        const y = h - pad - (Math.min(1, value / max)) * (h - pad * 2);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.strokeStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.stroke();
      if (fillUnder) {
        const last = values.length - 1;
        ctx.lineTo(pad + (last / Math.max(1, values.length - 1)) * (w - pad * 2), h - pad);
        ctx.lineTo(pad, h - pad);
        ctx.closePath();
        ctx.fillStyle = "rgba(22,132,90,0.08)";
        ctx.fill();
      }
    }

    function drawAgeHistogram() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const rect = ageCanvas.getBoundingClientRect();
      if (rect.width === 0 || rect.height === 0) return;
      ageCanvas.width = Math.round(rect.width * dpr);
      ageCanvas.height = Math.round(rect.height * dpr);
      ageCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ageCtx.clearRect(0, 0, rect.width, rect.height);
      const values = state.survival_histogram || [];
      const max = Math.max(1, ...values.map(Number));
      const pad = 10;
      const w = rect.width;
      const h = rect.height;
      drawGrid(ageCtx, pad, w, h);
      const n = Math.max(1, values.length);
      const barW = Math.max(1, (w - pad * 2) / n - 2);
      values.forEach((value, i) => {
        const x = pad + ((w - pad * 2) / n) * i + 1;
        const bh = Math.max(0, (value / max) * (h - pad * 2));
        const y = h - pad - bh;
        ageCtx.fillStyle = "#c47a09";
        ageCtx.fillRect(x, y, barW, bh);
      });
      ageCtx.fillStyle = "#607080";
      ageCtx.font = "11px sans-serif";
      ageCtx.textBaseline = "bottom";
      ageCtx.fillText(values.length ? `0-${values.length - 1}` : "", pad + 2, h - 2);
    }

    function renderCharts() {
      drawLineChart();
      drawAgeHistogram();
    }

    function renderControls() {
      const config = state.config || {};
      const setRange = (id, value, text) => {
        const input = $(id);
        input.value = value;
        $(id + "Value").textContent = text;
      };
      setRange("feedInterval", config.feed_interval ?? 5, `${config.feed_interval ?? 5}s`);
      setRange("survivalRounds", config.survival_rounds ?? 20, config.survival_rounds ?? 20);
      setRange("reproN", config.n_repro ?? 50, config.n_repro ?? 50);
      setRange("assort", Math.round((config.assort_strength ?? 0.5) * 100), `${Math.round((config.assort_strength ?? 0.5) * 100)}%`);
      setRange("capacity", config.capacity ?? 10000, config.capacity ?? 10000);
      setRange("initPop", config.init_pop ?? 1000, config.init_pop ?? 1000);
    }

    function renderFeedGrid() {
      if ($("feedGrid").childElementCount) return;
      for (let i = 0; i < 10; i++) {
        const button = document.createElement("button");
        button.className = "button";
        button.type = "button";
        button.textContent = String(i);
        button.addEventListener("click", () => manualFeed(i));
        $("feedGrid").appendChild(button);
      }
    }

    async function manualFeed(digit) {
      if (busy) return;
      busy = true;
      try {
        await api("/api/manual_feed", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ digit })
        });
        await refreshState();
      } catch (error) {
        console.error(error);
      } finally {
        busy = false;
      }
    }

    function buildArchSvg(layers) {
      const all = [784, ...layers, 10];
      const count = all.length;
      const width = Math.max(260, count * 48);
      const height = 112;
      const boxW = 40;
      const boxH = 60;
      let nodes = "";
      let links = "";
      all.forEach((n, i) => {
        const x = 8 + i * 48;
        const y = 26;
        nodes += `<rect x="${x}" y="${y}" width="${boxW}" height="${boxH}" rx="6" fill="${i === 0 ? "#e8edf1" : i === count - 1 ? "#dcefe6" : "#f2f5f7"}" stroke="#b7c4cf"/>`;
        nodes += `<text x="${x + boxW / 2}" y="${y + 29}" text-anchor="middle" font-size="11" fill="#1d2733">${n}</text>`;
        if (i < count - 1) {
          const x1 = x + boxW;
          const x2 = x + 48 + 8;
          links += `<line x1="${x1}" y1="${y + boxH / 2}" x2="${x2}" y2="${y + boxH / 2}" stroke="#9aaab8"/>`;
        }
      });
      return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="xMidYMid meet">${links}${nodes}</svg>`;
    }

    function renderInspect() {
      const panel = $("inspectPanel");
      const organism = state.alive.find((o) => o.id === inspectId);
      if (!organism) {
        inspectId = null;
        panel.className = "panel inspect empty";
        panel.innerHTML = "未选择个体";
        return;
      }
      panel.className = "panel inspect";
      panel.innerHTML = `
        <h2>个体解剖</h2>
        <div class="inspect-grid">
          <div class="cell"><span>ID</span><strong id="inspectId"></strong></div>
          <div class="cell"><span>年龄</span><strong id="inspectAge"></strong></div>
          <div class="cell"><span>出生回合</span><strong id="inspectBorn"></strong></div>
          <div class="cell"><span>上次数字</span><strong id="inspectDigit"></strong></div>
          <div class="cell"><span>数字倾向</span><strong id="inspectPreference"></strong></div>
          <div class="cell"><span>未繁殖回合</span><strong id="inspectFailed"></strong></div>
          <div class="cell"><span>上次产出</span><strong id="inspectPrediction"></strong></div>
          <div class="cell"><span>判断</span><strong id="inspectCorrect"></strong></div>
          <div class="cell"><span>权重数</span><strong id="inspectWeights"></strong></div>
          <div class="cell"><span>隐藏层</span><strong id="inspectDepth"></strong></div>
          <div class="cell"><span>寿命加成</span><strong id="inspectLongevity"></strong></div>
          <div class="cell"><span>繁殖力</span><strong id="inspectFecundity"></strong></div>
          <div class="cell"><span>错误耐受</span><strong id="inspectTolerance"></strong></div>
          <div class="cell"><span>突变率</span><strong id="inspectMutation"></strong></div>
          <div class="cell"><span>全数字Fitness</span><strong id="inspectFitness"></strong></div>
          <div class="cell"><span>最差数字</span><strong id="inspectWorstDigit"></strong></div>
        </div>
        <div class="arch" id="arch">${buildArchSvg(organism.layer_sizes)}</div>
      `;
      $("inspectId").textContent = organism.id;
      $("inspectAge").textContent = organism.age;
      $("inspectBorn").textContent = organism.born_round;
      $("inspectDigit").textContent = organism.last_digit >= 0 ? organism.last_digit : "-";
      $("inspectPreference").textContent = organism.digit_preference >= 0 ? organism.digit_preference : "-";
      $("inspectFailed").textContent = organism.failed_repro_rounds || 0;
      $("inspectPrediction").textContent = organism.prediction >= 0 ? organism.prediction : "-";
      $("inspectCorrect").textContent = organism.correct ? "正确" : "错误";
      $("inspectCorrect").style.color = organism.correct ? "#16845a" : "#c33a3a";
      $("inspectWeights").textContent = organism.weights_size;
      $("inspectDepth").textContent = organism.layer_sizes.length;
      $("inspectLongevity").textContent = organism.longevity_bonus || 0;
      $("inspectFecundity").textContent = (organism.fecundity || 1).toFixed(2);
      $("inspectTolerance").textContent = (organism.wrong_tolerance || 1).toFixed(2);
      $("inspectMutation").textContent = (organism.mutation_rate || 1).toFixed(2);
      $("inspectFitness").textContent = (organism.fitness || 0).toFixed(3);
      const accuracies = organism.digit_accuracies || [];
      $("inspectWorstDigit").textContent = accuracies.length
        ? `${accuracies.indexOf(Math.min(...accuracies))}:${Math.min(...accuracies).toFixed(2)}`
        : "-";
    }

    function renderAll() {
      renderStats();
      renderFood();
      renderControls();
      renderFeedGrid();
      drawDish();
      renderCharts();
      renderInspect();
    }

    dishCanvas.addEventListener("click", (event) => {
      const rect = dishCanvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      const radius = Math.min(rect.width, rect.height) * 0.46;
      const now = Date.now() / 1000;
      let best = null;
      let bestDist = 14;
      for (const organism of state.alive) {
        const h = hashInt(organism.id);
        const angle = h * Math.PI * 2 + Math.sin(now * 0.7 + organism.id) * 0.08;
        const rr = 0.16 + hashInt(organism.id * 7919) * 0.72;
        const ox = cx + Math.cos(angle) * rr * radius * 0.93;
        const oy = cy + Math.sin(angle) * rr * radius * 0.93;
        const dist = Math.hypot(ox - x, oy - y);
        if (dist < bestDist) {
          bestDist = dist;
          best = organism.id;
        }
      }
      inspectId = best;
      renderInspect();
      drawDish();
    });

    $("autoToggle").addEventListener("change", (event) => {
      auto = event.target.checked;
      scheduleNext();
    });

    $("resetButton").addEventListener("click", async () => {
      busy = true;
      try {
        await api("/api/reset", { method: "POST" });
        inspectId = null;
        await refreshState();
      } catch (error) {
        console.error(error);
      } finally {
        busy = false;
      }
    });

    const sliderMap = {
      feedInterval: (v) => ({ feed_interval: Number(v) }),
      survivalRounds: (v) => ({ survival_rounds: Number(v) }),
      reproN: (v) => ({ n_repro: Number(v) }),
      assort: (v) => ({ assort_strength: Number(v) / 100 }),
      capacity: (v) => ({ capacity: Number(v) }),
      initPop: (v) => ({ init_pop: Number(v) })
    };

    for (const id of Object.keys(sliderMap)) {
      const input = $(id);
      const output = $(id + "Value");
      input.addEventListener("input", () => {
        const value = Number(input.value);
        if (id === "feedInterval") output.textContent = `${value}s`;
        else if (id === "assort") output.textContent = `${value}%`;
        else output.textContent = String(value);
      });
      let timerId = null;
      input.addEventListener("change", () => {
        clearTimeout(timerId);
        timerId = setTimeout(() => postConfig(sliderMap[id](input.value)), 180);
      });
    }

    window.addEventListener("resize", () => {
      drawDish();
      renderCharts();
    });

    renderFeedGrid();
    refreshState();
  </script>
</body>
</html>
