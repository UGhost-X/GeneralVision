<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>🧫 LIF 生态游戏</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#e6edf3;
          --ok:#3fb950; --bad:#f85149; --dim:#8b949e; --accent:#58a6ff; --purple:#bc8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 "Segoe UI", system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:8px 18px;
           border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:5; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  .btn { background:var(--panel); color:var(--txt); border:1px solid var(--line);
         border-radius:6px; padding:4px 10px; cursor:pointer; }
  .btn:hover { border-color:var(--accent); }
  .dim { color:var(--dim); }
  #statsLabel { color:var(--dim); font-size:12px; }
  #tip { color:var(--accent); font-size:12px; min-height:16px; }
  .foodwrap { display:flex; align-items:center; gap:6px; }
  #foodDigit { width:56px; height:56px; image-rendering:pixelated; background:#000;
               border:1px solid var(--line); border-radius:6px; }
  #speed { width:110px; }
  #stopbar { display:flex; align-items:center; gap:10px; padding:6px 18px;
             border-bottom:1px solid var(--line); background:var(--panel); }
  #stopMsg { font-size:12px; color:var(--dim); white-space:nowrap; }
  .sb-track { flex:1; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
  #nrFill { width:0%; height:100%; background:var(--accent); transition:width .4s; }
  #stopbar.done #nrFill { background:var(--ok); }
  #stopbar.done #stopMsg { color:var(--ok); }
  main { display:grid; grid-template-columns: 1fr 320px; gap:12px; padding:12px; }
  #dish { width:100%; height:420px; background:var(--panel);
          border:1px solid var(--line); border-radius:8px; display:block; cursor:pointer; }
  .dishlegend { font-size:11px; color:var(--dim); padding:4px 2px 0; }
  #side { display:flex; flex-direction:column; gap:12px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
  #curves { width:100%; height:170px; }
  .cfgrow { margin:6px 0; }
  .cfgrow label { display:flex; justify-content:space-between; font-size:12px;
                  color:var(--dim); margin-bottom:2px; }
  .cfgrow input { width:100%; }
  .feedbtn { width:32px; height:32px; margin:2px; font-size:15px; cursor:pointer;
             background:var(--panel); color:var(--txt); border:1px solid var(--line);
             border-radius:6px; }
  .feedbtn:hover { border-color:var(--accent); }
  #manualResult { margin-top:8px; font-size:13px; }
  #manualResult canvas { image-rendering:pixelated; background:#000; border-radius:4px; }
  .mm { font-size:11px; color:var(--dim); margin-top:6px; }
  #anatomy .profile { display:flex; gap:2px; height:70px; align-items:flex-end; margin:8px 0; }
  #anatomy .profile > i { flex:1; background:var(--line); }
  #hist { width:100%; height:90px; margin-top:4px; }
  #newbornLabel { color:var(--ok); }
  .archrow { display:flex; gap:4px; align-items:stretch; margin:8px 0; }
  .archrow > * { flex:1; text-align:center; border-radius:4px; font-size:11px; padding:4px 0; }
  .archrow .archin { background:var(--line); color:var(--dim); }
  .archrow .archlay { background:var(--accent); color:var(--bg); }
  .archrow .archlay.multi { background:var(--purple); }
</style>
</head>
<body>
<header>
  <h1>🧫 LIF 生态游戏</h1>
  <span id="roundLabel" class="dim">第 0 回合</span>
  <span class="foodwrap"><canvas id="foodDigit" title="本回合食物数字"></canvas><span id="foodLabel" class="dim"></span></span>
  <button class="btn" id="playBtn">⏸ 自动</button>
  <button class="btn" id="stepBtn">⏭ 推演一回合</button>
  <label class="dim">投喂速度
    <input id="speed" type="range" min="1" max="10" value="5">
    <span id="speedVal">5</span> 秒/回合
  </label>
  <span id="tip" class="dim"></span>
  <span id="statsLabel"></span>
</header>
<div id="stopbar">
  <div id="stopMsg" class="sb-msg">自然死亡 <b id="nrLabel">0%</b> / 目标 95%</div>
  <div class="sb-track"><div id="nrFill"></div></div>
</div>
<main>
  <div>
    <canvas id="dish"></canvas>
    <div class="dishlegend">点击色块查看个体 · 绿=本回合吃对 · 红=本回合吃错 · 灰蓝=存活待喂 · 死亡个体回合末即移除</div>
  </div>
  <aside id="side">
    <div class="panel"><b>环境参数</b>
      <div class="cfgrow"><label>存活回合数 <span id="v_survival">20</span></label>
        <input type="range" id="c_survival" min="10" max="30" value="20"></div>
      <div class="cfgrow"><label>繁殖倍数 N <span id="v_nrepro">50</span></label>
        <input type="range" id="c_nrepro" min="10" max="100" value="50"></div>
      <div class="cfgrow"><label>选型强度 s <span id="v_assort">50</span></label>
        <input type="range" id="c_assort" min="0" max="100" step="5" value="50"></div>
      <div class="cfgrow"><label>承载力 <span id="v_capacity">10000</span></label>
        <input type="range" id="c_capacity" min="100" max="10000" step="100" value="10000"></div>
      <div class="cfgrow"><label>初始种群 <span id="v_initial">1000</span></label>
        <input type="range" id="c_initial" min="60" max="1000" step="10" value="1000"></div>
      <div class="mm">改动即时生效；初始种群仅在全灭重播时使用。</div>
    </div>
    <div class="panel"><b>种群统计</b>
      <canvas id="curves"></canvas>
      <div class="mm">蓝=正确率　绿=种群/承载力　紫=自然死亡率</div>
      <div id="newbornLabel" class="mm"></div>
      <canvas id="hist"></canvas>
      <div class="mm">存活回合数分布（横轴 1..上限，亮绿=当前峰值）</div>
    </div>
    <div class="panel"><b>手动喂食</b>
      <div class="mm" id="feedTarget">目标：随机存活者（点击色块指定）</div>
      <div id="manualBtns"></div>
      <div id="manualResult"></div>
    </div>
    <div class="panel"><b>个体解剖</b><div id="anatomy"><span class="mm">点击培养皿色块查看个体</span></div></div>
  </aside>
</main>
<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = { round:0, pop:new Map(), config:null, stats:null, auto:true,
                speed:5000, foodLabel:null, naturalSeries:[], correctSeries:[],
                popSeries:[], stepping:false, selected:null,
                reseeded:false };
let dishLayout = null, dishNames = [];   // 最近一次 drawDish 的网格布局与顺序，供点击命中

function tip(m){ const t = $("#tip"); if (t) t.textContent = m; }
function flash(msg){
  const s = $("#statsLabel");
  s.innerHTML = `<span style="color:var(--ok)">${esc(msg)}</span>`;
  clearTimeout(flash._t);
  flash._t = setTimeout(updateHeader, 1200);
}

// ---------- 渲染：头部 / 停止条 / 曲线 ----------
function updateHeader(){
  $("#roundLabel").textContent = `第 ${state.round} 回合`;
  const s = state.stats;
  if (!s){ $("#statsLabel").textContent = "加载中…"; return; }
  const acc = (s.avg_acc != null) ? (s.avg_acc*100).toFixed(1)+"%" : "—";
  const sr = (s.survival_rate != null) ? (s.survival_rate*100).toFixed(1)+"%" : "—";
  const al = (s.alpha != null) ? "α "+s.alpha.toFixed(1) : "—";
  $("#statsLabel").innerHTML = `种群 <b>${s.alive}</b> · 正确率 <b>${acc}</b> · 存活率 <b>${sr}</b> · ${al}`;
}

function updateStopbar(){
  const s = state.stats;
  const nr = s ? (s.natural_rate || 0) : 0;
  const stopped = !!(s && s.stopped);
  $("#nrFill").style.width = (Math.min(1, nr/0.95)*100).toFixed(1) + "%";
  $("#nrLabel").textContent = (nr*100).toFixed(1) + "%";
  $("#stopbar").classList.toggle("done", stopped);
  $("#stopMsg").innerHTML = stopped
    ? "🎯 达成 95% 自然死亡目标，已停止"
    : `自然死亡 <b>${(nr*100).toFixed(1)}%</b> / 目标 95%`;
}

function pushCurves(){
  const s = state.stats; if (!s) return;
  state.correctSeries.push(s.avg_acc);
  state.popSeries.push(s.alive);
  state.naturalSeries.push(s.natural_rate);
  const MAX = 200;
  if (state.correctSeries.length > MAX){
    state.correctSeries.shift(); state.popSeries.shift(); state.naturalSeries.shift();
  }
}

function drawCurves(){
  const cv = $("#curves"), ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const n = state.correctSeries.length;
  if (n < 1){
    ctx.fillStyle = "#8b949e"; ctx.font = "13px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.fillText("等待推演…", W/2, H/2);
    return;
  }
  const plot = (series, color, width = 1.5) => {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.beginPath();
    series.forEach((v,i) => {
      const x = n === 1 ? W/2 : i/(n-1)*W, y = H - Math.max(0, Math.min(1, v))*H;
      i ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
    });
    ctx.stroke();
  };
  plot(state.correctSeries, "#58a6ff");                          // 蓝=正确率 0-1
  plot(state.naturalSeries, "#bc8cff");                          // 紫=自然死亡率 0-1
  const cap = (state.config && state.config.capacity) || 10000;    // 绿=种群/承载力
  plot(state.popSeries.map(v => v/cap), "#3fb950");
}

function drawAgeHist(hist, newborns){
  const cv = $("#hist"); if (!cv) return;
  const dpr = devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  $("#newbornLabel").textContent = newborns ? `本回合新生 ${newborns} 只` : "";
  if (!hist || !hist.length){
    ctx.fillStyle = "#8b949e"; ctx.font = "12px system-ui, sans-serif";
    ctx.textAlign = "center"; ctx.fillText("等待推演…", W/2, H/2);
    return;
  }
  const maxv = Math.max(1, ...hist);
  const bw = Math.max(1, W / hist.length - 2);
  hist.forEach((v,i) => {
    const h = Math.max(1, v / maxv * (H - 8));
    ctx.fillStyle = v > 0 && v === maxv ? "var(--ok)" : "var(--accent)";
    ctx.fillRect(i * (W / hist.length) + 1, H - h, bw, h);
  });
}

// ---------- 渲染：canvas 培养皿 ----------
function drawDish(){
  const cv = $("#dish"); if (!cv) return;
  const ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1;
  const cw = cv.clientWidth, ch = cv.clientHeight;
  if (!cw || !ch) return;
  cv.width = Math.round(cw*dpr); cv.height = Math.round(ch*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cw,ch);
  dishLayout = null; dishNames = [];
  const alive = state.pop.size;
  if (!alive){
    ctx.fillStyle = "#8b949e"; ctx.font = "14px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("（培养皿空 — 全灭重播中…）", cw/2, ch/2);
    return;
  }
  const gap = 1;
  const cols = Math.max(1, Math.ceil(Math.sqrt(alive)));
  const rows = Math.max(1, Math.ceil(alive/cols));
  let cell = Math.floor(Math.min((cw-(cols-1)*gap)/cols, (ch-(rows-1)*gap)/rows));
  if (cell < 4) cell = Math.max(1, cell);            // 大种群兜底：可 <4px，但保证全部入画
  const gridW = cols*cell + (cols-1)*gap;
  const gridH = rows*cell + (rows-1)*gap;
  const ox = Math.max(0, Math.floor((cw-gridW)/2));
  const oy = Math.max(0, Math.floor((ch-gridH)/2));
  dishLayout = { cols, rows, cell, gap, ox, oy };
  dishNames = [...state.pop.keys()];
  const bw = Math.max(1, Math.ceil(cell/5));
  for (let i=0;i<dishNames.length;i++){
    const name = dishNames[i], g = state.pop.get(name);
    const col = i % cols, row = (i/cols)|0;
    const x = ox + col*(cell+gap), y = oy + row*(cell+gap);
    ctx.fillStyle = g.status === "correct" ? "#3fb950"
      : g.status === "wrong" ? "#f85149"
      : "#7c8aa0";                                          // 灰蓝=存活待喂
    ctx.fillRect(x, y, cell, cell);
    if (g.birth){ ctx.strokeStyle = "#3fb950"; ctx.lineWidth = bw; ctx.strokeRect(x, y, cell, cell); }
    if (name === state.selected){
      ctx.strokeStyle = "#e6edf3"; ctx.lineWidth = bw+1;
      ctx.strokeRect(x-bw, y-bw, cell+2*bw, cell+2*bw);
    }
  }
}

// ---------- 数字绘制 ----------
function drawDigitCanvas(cv, pixels, scale){
  if (!cv || !pixels) return;
  const s = scale, ctx = cv.getContext("2d");
  cv.width = 28*s; cv.height = 28*s;
  ctx.clearRect(0,0,cv.width,cv.height);
  for (let y=0;y<28;y++) for (let x=0;x<28;x++){
    const v = pixels[y*28+x];
    ctx.fillStyle = `rgb(${Math.round(v*255)},${Math.round(v*255)},${Math.round(v*255)})`;
    ctx.fillRect(x*s, y*s, s, s);
  }
}

// ---------- 状态加载 ----------
function syncConfigSliders(){
  const c = state.config; if (!c) return;
  const map = { c_survival:["survival_rounds","v_survival"], c_nrepro:["n_repro","v_nrepro"],
                c_capacity:["capacity","v_capacity"], c_initial:["initial_pop","v_initial"],
                c_assort:["assort_strength","v_assort",100] };   // 第 3 元 = 显示缩放（0-1 → 0-100）
  for (const id in map){
    const [key, vlabel, scale] = map[id];
    const v = (scale || 1) * c[key];
    document.getElementById(id).value = v;
    document.getElementById(vlabel).textContent = Math.round(v);
  }
}

function rebuildPop(population){
  state.pop.clear();
  for (const p of population){
    state.pop.set(p.name, { name:p.name, age:p.age, born_gen:p.born_gen, parents:p.parents,
                            arch:p.arch, alive:true, status:"idle", birth:false,
                            lastProduced:null, lastCorrect:null, readout_profile:null });
  }
}

async function loadState(){
  try {
    const s = await (await fetch("/api/state")).json();
    state.round = Math.max(0, s.round - 1);       // state.round 是"下一回合"计数，显示最后完成回合
    state.config = s.config; state.stats = s.stats;
    // 服务端 history 预填充曲线 → 打开页面即有历史（最多最近 200 回合）
    state.correctSeries = []; state.popSeries = []; state.naturalSeries = [];
    for (const h of (s.history || []).slice(-200)){
      state.correctSeries.push(h.avg_acc);
      state.popSeries.push(h.alive);
      state.naturalSeries.push(h.natural_rate);
    }
    syncConfigSliders();
    rebuildPop(s.population);
    drawDish(); drawCurves(); updateHeader(); updateStopbar();
    if (s.stats) drawAgeHist(s.stats.age_hist, s.stats.newborns);
  } catch (err) {
    console.error("加载失败：", err);
    $("#statsLabel").innerHTML = `<b style="color:var(--bad)">⚠ 加载失败：${esc(err.message)}</b>`;
  }
}

async function refreshPopulation(){               // 全灭重播后用真实名字重建
  try {
    const s = await (await fetch("/api/state")).json();
    state.round = Math.max(0, s.round - 1);
    state.stats = s.stats;
    if (s.config){ state.config = s.config; syncConfigSliders(); }
    rebuildPop(s.population);
    updateHeader(); updateStopbar(); drawDish();
    if (s.stats) drawAgeHist(s.stats.age_hist, s.stats.newborns);
  } catch (err) {
    console.error("刷新种群失败：", err);
  }
}

// ---------- 回合推演 + 回放 ----------
async function stepRound(){
  if (state.stepping) return;                    // 防重入：服务端未返回/动画未放完前忽略
  state.stepping = true;
  try {
    tip("⏳ 推演中…");
    const r = await (await fetch("/api/step", {method:"POST"})).json();
    await replayEvents(r.events, r.stats);
  } catch (err) {
    console.error("推演失败：", err);
    tip(`⚠ 推演失败：${esc(err.message)}`);
  } finally {
    state.stepping = false;
    tip("");
  }
}

async function replayEvents(events, stats){
  const dur = Math.max(800, state.speed);         // 动画时长下限=投喂速度（1-10s）
  let food = null, rEnd = null, reseed = null;
  const orgRound = [], deaths = [], births = [];
  for (const e of events){
    if (e.type === "round_begin") food = e;
    else if (e.type === "org_round") orgRound.push(e);
    else if (e.type === "death") deaths.push(e);
    else if (e.type === "birth") births.push(e);
    else if (e.type === "reseed") reseed = e;
    else if (e.type === "round_end") rEnd = e;
  }

  // ---- 1. 刷新展示：食物数字 + 复位对错色 ----
  if (food){
    state.round = food.round;
    state.foodLabel = food.food_label;
    try {
      const d = await (await fetch("/api/digit_image/" + food.food_idx)).json();
      drawDigitCanvas($("#foodDigit"), d.pixels, 2);
    } catch (_e) { /* 取图失败仅显示标签 */ }
    $("#foodLabel").textContent = "食: " + food.food_label;
    tip(`🍽 第 ${food.round} 回合：食物数字 ${food.food_label}`);
    for (const g of state.pop.values()) g.status = "idle";
    updateHeader();
    drawDish();
    await sleep(Math.max(300, dur*0.10));
  }

  // ---- 2. 逐个体亮对/错（分批闪烁，受速度控制） ----
  const revealDur = dur*0.42;
  const chunks = Math.max(1, Math.min(60, Math.ceil(orgRound.length/64)));
  const perChunk = Math.max(1, Math.ceil(orgRound.length/chunks));
  for (let i=0;i<orgRound.length;i+=perChunk){
    const slice = orgRound.slice(i, i+perChunk);
    for (const e of slice){
      const g = state.pop.get(e.name); if (!g) continue;
      g.age = e.age;
      g.status = e.correct ? "correct" : "wrong";
      g.lastProduced = e.produced; g.lastCorrect = e.correct;
      g.readout_profile = e.readout_profile;
    }
    drawDish();
    await sleep(Math.max(16, revealDur/chunks));
  }

  // ---- 3. 繁殖：新生加入培养皿并绿框高亮 ----
  if (births.length){
    tip(`🧬 本回合繁殖：新生 ${births.length} 只`);
    for (const b of births){
      state.pop.set(b.name, { name:b.name, age:0, born_gen:b.gen, parents:b.parents, arch:b.arch,
                              alive:true, status:"idle", birth:true,
                              lastProduced:null, lastCorrect:null, readout_profile:null });
    }
    drawDish();
    await sleep(Math.min(700, Math.max(350, dur*0.15)));
    for (const b of births){ const g = state.pop.get(b.name); if (g) g.birth = false; }
  }

  // ---- 4. 死亡即移除：清除死亡生物体，重绘只保留存活者 ----
  if (deaths.length){
    const nNat = deaths.filter(d => d.cause === "natural").length;
    tip(`☠ 死亡 ${deaths.length} 只（自然 ${nNat} / 淘汰 ${deaths.length - nNat}）`);
    for (const d of deaths) state.pop.delete(d.name);
    if (state.selected && !state.pop.has(state.selected)) state.selected = null;
    drawDish();
    await sleep(Math.min(400, Math.max(200, dur*0.08)));
  }

  // ---- 5. 全灭重播：清空并重建 ----
  if (reseed){
    state.pop.clear(); state.selected = null; state.reseeded = true;
    tip(`💀 全灭！重播初始种群 ${reseed.count} 只`);
    drawDish();
    await sleep(700);
  }

  // ---- 6. 结算：统计 / 曲线 / 停止判断 ----
  if (rEnd){
    state.stats = rEnd.stats;
    state.round = rEnd.stats.round;
    pushCurves();
  }
  updateHeader(); updateStopbar(); drawCurves(); drawDish();
  if (state.stats) drawAgeHist(state.stats.age_hist, state.stats.newborns);
  if (state.reseeded){
    await refreshPopulation();
    state.reseeded = false;
    tip("");
  }
  if (state.stats && state.stats.stopped){
    state.auto = false;
    $("#playBtn").textContent = "▶ 手动";
  }
  updateFeedTarget();
}

// ---------- 个体解剖 ----------
function showAnatomy(name){
  const g = state.pop.get(name); if (!g) return;
  state.selected = name;
  const box = $("#anatomy");
  const profile = g.readout_profile || [];
  const arch = g.arch || [];
  const multi = arch.length > 1;
  const archHtml = arch.length
    ? `<div class="archrow"><span class="archin">784</span>` +
      arch.map((n,i) => `<i class="archlay${multi ? " multi" : ""}" title="隐藏层${i+1} · ${n} 神经元">${n}</i>`).join("") +
      `<span class="archin">10</span></div>`
    : "";
  const parentHtml = g.parents ? g.parents.map(esc).join(" × ") : "（初始个体）";
  const feedInfo = (g.lastProduced != null)
    ? `吐出 ${g.lastProduced === -1 ? "（没吐出）" : g.lastProduced} ${g.lastCorrect ? "✓" : "✗"}`
    : "本回合未喂食";
  box.innerHTML = `${archHtml}<b>${esc(name)}</b>
    <div class="mm">${arch.length ? `架构 ${arch.join(" → ")} → 10<br>` : ""}父母：${parentHtml} · 出生第 ${g.born_gen} 回合 · 已活 ${g.age} 回合<br>
    本回合：${feedInfo}</div>
    <div class="profile">${profile.length
      ? profile.map((v,i) =>
          `<i style="height:${Math.max(1.5, Math.min(100, v*10))}%;background:${v > 0 ? "var(--accent)" : "var(--line)"}"
                title="产出神经元${i} 脉冲${v}"></i>`).join("")
      : '<span class="mm">（暂无产出数据）</span>'}</div>
    <div class="mm">产出神经元脉冲分布（10 通道）</div>`;
  updateFeedTarget();
  drawDish();
}

// ---------- 手动喂食 ----------
function updateFeedTarget(){
  const t = $("#feedTarget");
  if (!t) return;
  t.textContent = (state.selected && state.pop.has(state.selected))
    ? `目标：${state.selected}（点击色块切换）`
    : "目标：随机存活者（点击色块指定）";
}

function manualTarget(){
  if (state.selected && state.pop.has(state.selected)) return state.selected;
  const names = [...state.pop.keys()];
  return names.length ? names[(Math.random()*names.length)|0] : null;
}

async function manualFeed(digit){
  const box = $("#manualResult");
  const target = manualTarget();
  if (!target){ box.innerHTML = '<span class="mm" style="color:var(--bad)">当前没有存活个体，无法喂食</span>'; return; }
  try {
    const r = await (await fetch("/api/manual_feed", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({digit, name:target})})).json();
    if (r.error){ box.innerHTML = `<span class="mm" style="color:var(--bad)">${esc(r.error)}</span>`; return; }
    const ok = r.correct;
    box.innerHTML = `<canvas></canvas>
      <div class="mm" style="font-size:15px">喂给 <b>${esc(target)}</b>：吃进 <b>${r.label}</b> → 吐出
      <b>${r.produced === -1 ? "（没吐出）" : r.produced}</b>
      <span style="color:${ok ? "var(--ok)" : "var(--bad)"}">${ok ? "✓" : "✗"}</span></div>`;
    drawDigitCanvas(box.querySelector("canvas"), r.food_pixels, 8);
    const g = state.pop.get(target);               // 培养皿上短暂闪对/错色
    if (g){ g.status = ok ? "correct" : "wrong"; drawDish();
      setTimeout(() => { if (state.pop.get(target)){ g.status = "idle"; drawDish(); } }, 900); }
  } catch (err) {
    console.error("手动喂食失败：", err);
    box.innerHTML = `<span class="mm" style="color:var(--bad)">⚠ 手动喂食失败：${esc(err.message)}</span>`;
  }
}

// ---------- 控制 ----------
async function autoLoop(){
  while (state.auto && !(state.stats && state.stats.stopped)){
    if (state.stepping){ await sleep(150); continue; }
    await stepRound();          // 服务端计算 + 动画；回合间无额外等待（计算本身即节流）
  }
}

function bindControls(){
  $("#playBtn").addEventListener("click", () => {
    if (state.stats && state.stats.stopped) return;   // 已达成停止条件，禁止再自动
    state.auto = !state.auto;
    $("#playBtn").textContent = state.auto ? "⏸ 自动" : "▶ 手动";
    if (state.auto) autoLoop();
  });
  $("#stepBtn").addEventListener("click", () => {
    state.auto = false;
    $("#playBtn").textContent = "▶ 手动";
    stepRound();
  });
  $("#speed").addEventListener("input", e => {
    const v = +e.target.value;
    state.speed = v*1000;                          // 1-10 秒 → 1000-10000ms
    $("#speedVal").textContent = v;
  });
  $("#dish").addEventListener("click", ev => {     // 点击色块 → 解剖
    if (!dishLayout || !dishNames.length) return;
    const rect = ev.target.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const { cols, rows, cell, gap, ox, oy } = dishLayout;
    const c = Math.floor((mx-ox)/(cell+gap));
    const r = Math.floor((my-oy)/(cell+gap));
    if (c < 0 || r < 0 || r >= rows) return;
    const idx = r*cols + c;
    if (idx >= 0 && idx < dishNames.length){
      const name = dishNames[idx];
      const cx = ox + c*(cell+gap), cy = oy + r*(cell+gap);
      if (mx >= cx && mx < cx+cell && my >= cy && my < cy+cell){
        showAnatomy(name);
      }
    }
  });
}

function bindConfig(id, key, vlabel, scale){
  const el = document.getElementById(id);
  el.addEventListener("input", () => {
    document.getElementById(vlabel).textContent = el.value;
    clearTimeout(el._t);                           // 拖拽防抖
    el._t = setTimeout(() => postConfig({[key]: +el.value / (scale || 1)}), 250);   // JSON 数字（assort 0-100 → 0-1）
  });
}

async function postConfig(patch){
  try {
    const r = await (await fetch("/api/config", {method:"POST",
      headers:{"Content-Type":"application/json"}, body:JSON.stringify(patch)})).json();
    if (r.config) state.config = r.config;
    flash("参数已更新");
  } catch (err) {
    flash("⚠ 参数更新失败");
  }
}

// ---------- 初始化 ----------
(async function init(){
  $("#roundLabel").textContent = "加载中…";
  const btns = $("#manualBtns");                   // 0-9 手动喂食按钮
  for (let d=0; d<10; d++){
    const b = document.createElement("button");
    b.className = "feedbtn"; b.textContent = String(d);
    b.addEventListener("click", () => manualFeed(d));
    btns.appendChild(b);
  }
  bindConfig("c_survival","survival_rounds","v_survival");
  bindConfig("c_nrepro","n_repro","v_nrepro");
  bindConfig("c_assort","assort_strength","v_assort",100);
  bindConfig("c_capacity","capacity","v_capacity");
  bindConfig("c_initial","initial_pop","v_initial");
  bindControls();
  const s = $("#speed");
  state.speed = (+s.value)*1000;
  $("#speedVal").textContent = s.value;
  await loadState();
  if (state.stats && !state.stats.stopped && state.auto) autoLoop();
})();
</script>
